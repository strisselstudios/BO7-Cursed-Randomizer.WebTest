<!-- ==========================================================
     1. NACHT RAIDERS TITLE SCREEN
     ----------------------------------------------------------
     Displays the animated title artwork between the diagnostic
     boot sequence and the functional Nacht Raiders menu.
========================================================== -->

<section
  id="nachtRaidersTitleScreen"
  class="nacht-raiders-interface-screen nacht-raiders-title-screen"
  aria-label="Nacht Raiders title screen"
  hidden
>

  <button
    id="nachtRaidersTitleButton"
    class="nacht-raiders-title-button"
    type="button"
    aria-label="Proceed to the Nacht Raiders menu"
  >

    <img
      class="nacht-raiders-title-image"
      src="meat/images/nacht-raiders/menu/nacht-raiders-menu.gif"
      alt=""
      draggable="false"
    >

  </button>

</section>

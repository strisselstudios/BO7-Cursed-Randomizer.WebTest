<!-- ==========================================================
  STATS VIEW
  ----------------------------------------------------------
  Player totals, production, and progression information.
========================================================== -->

        <section
          id="statsView"
          class="panel-view"
          data-view="stats"
          hidden
        >

          <h2>STATS</h2>

          <div class="stats-list">

            <div class="stat-row">
              <span>Meat in bank</span>
              <strong id="meatBankStat">0</strong>
            </div>

            <div class="stat-row">
              <span>Total meat produced</span>
              <strong id="totalMeatStat">0</strong>
            </div>

            <div class="stat-row">
              <span>Meat per second</span>
              <strong id="meatPerSecondStat">0</strong>
            </div>

            <div class="stat-row">
              <span>Meat per click</span>
              <strong id="meatPerClickStat">1</strong>
            </div>

            <div class="stat-row">
              <span>Total clicks</span>
              <strong id="totalClicksStat">0</strong>
            </div>

            <div class="stat-row">
              <span>Producers owned</span>
              <strong id="producersOwnedStat">0</strong>
            </div>

            <div class="stat-row">
              <span>Run time</span>
              <strong id="runTimeStat">0 seconds</strong>
            </div>

          </div>

        </section>

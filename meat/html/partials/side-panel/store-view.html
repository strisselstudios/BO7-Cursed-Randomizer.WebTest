<section
  id="storeView"
  class="panel-view active-panel"
  data-view="store"
>

  <div class="store-sticky-header">

    <nav
      class="store-page-tabs"
      aria-label="Store pages"
    >
      <button
        class="store-page-tab active-store-page-tab"
        type="button"
        data-store-page-target="meat-mart"
        aria-pressed="true"
      >
        MEAT MART
      </button>

      <button
        class="store-page-tab"
        type="button"
        data-store-page-target="schematics"
        aria-pressed="false"
      >
        MARLTON'S SCHEMATICS
      </button>
    </nav>

    <div
      id="storeTransactionControls"
      class="store-transaction-controls"
    >
      <div
        class="store-mode-controls"
        role="group"
        aria-label="Store transaction type"
      >
        <button
          class="store-control-button active-store-control"
          type="button"
          data-store-mode="buy"
          aria-pressed="true"
        >
          BUY
        </button>

        <button
          class="store-control-button"
          type="button"
          data-store-mode="sell"
          aria-pressed="false"
        >
          SELL
        </button>
      </div>

      <div
        class="store-quantity-controls"
        role="group"
        aria-label="Store transaction quantity"
      >
        <button
          class="store-control-button active-store-control"
          type="button"
          data-store-quantity="1"
          aria-pressed="true"
        >
          ×1
        </button>

        <button
          class="store-control-button"
          type="button"
          data-store-quantity="10"
          aria-pressed="false"
        >
          ×10
        </button>

        <button
          class="store-control-button"
          type="button"
          data-store-quantity="100"
          aria-pressed="false"
        >
          ×100
        </button>

        <button
          class="store-control-button"
          type="button"
          data-store-quantity="max"
          aria-pressed="false"
        >
          MAX
        </button>
      </div>
    </div>

  </div>

  <div
    id="meatMartPage"
    class="store-page"
    data-store-page="meat-mart"
  >

  <div
    id="producerList"
    class="producer-list"
  >

   <div
  id="silverSpoonCardGroup"
  class="producer-card-group"
>

  <button
    class="producer-card"
    type="button"
    data-producer="silverSpoon"
  >

    <span
      class="
        producer-icon-slot
        producer-icon-slot-filled
      "
      aria-hidden="true"
    >
      <img
        id="silverSpoonIcon"
        src="meat/images/buildings/silver-spoon/spork-locked.png"
        alt=""
      >
    </span>

    <span class="producer-information">

      <strong>
        Silver Spoon
      </strong>

      <small>
        Produces 0.1 meat per second
      </small>

    </span>

    <span class="producer-purchase">

      <strong id="silverSpoonCost">
        15 MEAT
      </strong>

      <small id="silverSpoonOwned">
        Owned: 0
      </small>

    </span>

  </button>

  <button
    id="harvesterStoreActionButton"
    class="harvester-store-action-button"
    type="button"
    aria-label="Deploy Golden Spork Harvester"
    data-harvester-action="deploy"
    hidden
  >
    <span
      class="harvester-store-action-label"
    >
      DEPLOY HARVESTER
    </span>
  </button>

   </div>

<!-- ==========================================================
  1. HIGH STEAKS WINDOW LAYER
  ----------------------------------------------------------
  Asset-independent saloon prototype opened through the Tier III
  Sunken Mining Town launcher. Future art can replace the CSS
  placeholders without changing the interface structure.
========================================================== -->
<div
  id="highSteaksOverlay"
  class="high-steaks-overlay"
  aria-hidden="true"
  hidden
>
  <section
    id="highSteaksWindow"
    class="high-steaks-window"
    role="dialog"
    aria-modal="true"
    aria-labelledby="highSteaksWindowTitle"
    tabindex="-1"
  >
    <!-- ======================================================
      1.1 SALOON HEADER
    ======================================================= -->
    <header class="high-steaks-title-bar">
      <div class="high-steaks-window-identity">
        <span class="high-steaks-window-mark" aria-hidden="true">♠</span>
        <div>
          <span>THE SUNKEN MINING TOWN SALOON</span>
          <strong id="highSteaksWindowTitle">HIGH STEAKS</strong>
        </div>
      </div>

      <button
        id="highSteaksCloseButton"
        class="high-steaks-close-button"
        type="button"
        aria-label="Leave the High Steaks table"
        title="Leave the High Steaks table"
      >
        <span aria-hidden="true">×</span>
      </button>
    </header>

    <!-- ======================================================
      1.2 PROTOTYPE TABLE
    ======================================================= -->
    <main class="high-steaks-saloon">
      <section class="high-steaks-opponent-zone" aria-labelledby="highSteaksOpponentName">
        <div class="high-steaks-opponent-portrait" aria-hidden="true">
          <span>?</span>
        </div>

        <div class="high-steaks-opponent-information">
          <span class="high-steaks-zone-label">HOUSE PLAYER</span>
          <h2 id="highSteaksOpponentName">UNKNOWN DRIFTER</h2>
          <ol class="high-steaks-score-pips" aria-label="Opponent round wins: 0">
            <li></li><li></li><li></li>
          </ol>
        </div>

        <div
          id="highSteaksOpponentHand"
          class="high-steaks-hand high-steaks-opponent-hand"
          data-hand-owner="opponent"
          aria-label="Opponent hand: 10 hidden cards"
        >
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="0"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="1"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="2"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="3"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="4"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="5"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="6"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="7"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="8"></span>
          <span class="high-steaks-card high-steaks-card-back" data-card-slot="9"></span>
        </div>
      </section>

      <section class="high-steaks-table" aria-label="High Steaks card table">
        <div class="high-steaks-table-rail" aria-hidden="true"></div>

        <div class="high-steaks-table-content">
          <div class="high-steaks-play-lane" data-play-owner="opponent">
            <span class="high-steaks-play-slot">?</span>
            <span class="high-steaks-play-slot">?</span>
          </div>

          <div class="high-steaks-table-center">
            <span class="high-steaks-table-eyebrow">FIRST TO THREE</span>
            <strong>HIGH STEAKS</strong>
            <p id="highSteaksTableStatus" role="status" aria-live="polite">NO ACTIVE DEAL</p>
          </div>

          <div class="high-steaks-play-lane" data-play-owner="player">
            <span class="high-steaks-play-slot">?</span>
            <span class="high-steaks-play-slot">?</span>
          </div>
        </div>
      </section>

      <section class="high-steaks-player-zone" aria-labelledby="highSteaksPlayerLabel">
        <div class="high-steaks-player-heading">
          <div>
            <span class="high-steaks-zone-label">YOUR HAND</span>
            <h2 id="highSteaksPlayerLabel">THE MEAT HARVESTER</h2>
          </div>

          <ol class="high-steaks-score-pips" aria-label="Player round wins: 0">
            <li></li><li></li><li></li>
          </ol>
        </div>

        <div
          id="highSteaksPlayerHand"
          class="high-steaks-hand high-steaks-player-hand"
          data-hand-owner="player"
          aria-label="Prototype player hand"
        >
          <span class="high-steaks-card high-steaks-card-face" data-card-slot="0" data-card-value="1"><b>1</b><i>♠</i></span>
          <span class="high-steaks-card high-steaks-card-face high-steaks-card-red" data-card-slot="1" data-card-value="2"><b>2</b><i>♦</i></span>
          <span class="high-steaks-card high-steaks-card-face" data-card-slot="2" data-card-value="3"><b>3</b><i>♣</i></span>
          <span class="high-steaks-card high-steaks-card-face high-steaks-card-red" data-card-slot="3" data-card-value="4"><b>4</b><i>♥</i></span>
          <span class="high-steaks-card high-steaks-card-face" data-card-slot="4" data-card-value="5"><b>5</b><i>♠</i></span>
          <span class="high-steaks-card high-steaks-card-face high-steaks-card-red" data-card-slot="5" data-card-value="6"><b>6</b><i>♦</i></span>
          <span class="high-steaks-card high-steaks-card-face" data-card-slot="6" data-card-value="7"><b>7</b><i>♣</i></span>
          <span class="high-steaks-card high-steaks-card-face high-steaks-card-red" data-card-slot="7" data-card-value="8"><b>8</b><i>♥</i></span>
          <span class="high-steaks-card high-steaks-card-face" data-card-slot="8" data-card-value="9"><b>9</b><i>♠</i></span>
          <span class="high-steaks-card high-steaks-card-face high-steaks-card-red" data-card-slot="9" data-card-value="10"><b>10</b><i>♦</i></span>
        </div>

        <button class="high-steaks-deal-button" type="button" disabled>
          DEAL ENGINE COMING NEXT
        </button>
      </section>
    </main>
  </section>
</div>

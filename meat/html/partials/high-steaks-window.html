<!-- ==========================================================
     1. HIGH STEAKS WINDOW
     ----------------------------------------------------------
     Tier III Sunken Mining Town card-table prototype.
========================================================== -->
<div
  id="highSteaksOverlay"
  class="high-steaks-overlay"
  aria-hidden="true"
  hidden
>
  <section
    id="highSteaksWindow"
    class="high-steaks-window"
    role="dialog"
    aria-modal="true"
    aria-labelledby="highSteaksTitle"
    tabindex="-1"
  >
    <header class="high-steaks-title-bar">
      <div class="high-steaks-window-identity">
        <span
          class="high-steaks-window-mark"
          aria-hidden="true"
        >
          HS
        </span>

        <div>
          <span>SUNKEN MINING TOWN SALOON</span>
          <strong id="highSteaksTitle">
            HIGH STEAKS
          </strong>
        </div>
      </div>

      <button
        id="highSteaksCloseButton"
        class="high-steaks-close-button"
        type="button"
        aria-label="Leave the High Steaks table"
      >
        ×
      </button>
    </header>

    <div
      id="highSteaksScene"
      class="high-steaks-scene"
      data-high-steaks-scene-state="table"
    >
      <div class="high-steaks-scene-artboard">
        <img
          class="high-steaks-scene-art high-steaks-scene-art-background"
          src="meat/features/high-steaks/images/backgrounds/background-1.png"
          alt=""
          aria-hidden="true"
          draggable="false"
        >

        <img
          class="high-steaks-scene-art high-steaks-scene-art-dealer"
          src="meat/features/high-steaks/images/opponents/dealer-1.png"
          alt=""
          aria-hidden="true"
          draggable="false"
        >

        <img
          class="high-steaks-scene-art high-steaks-scene-art-table"
          src="meat/features/high-steaks/images/tables/table-1.png"
          alt=""
          aria-hidden="true"
          draggable="false"
        >

        <div
          class="high-steaks-scoreboard"
          aria-label="Match score"
        >
          <div class="high-steaks-scoreboard-side">
            <span class="high-steaks-scoreboard-label">
              DEALER
            </span>

            <ol
              id="highSteaksOpponentWins"
              class="high-steaks-score-pips"
            >
              <li></li>
              <li></li>
              <li></li>
            </ol>
          </div>

          <div class="high-steaks-scoreboard-round">
            <span>ROUND</span>
            <strong id="highSteaksRoundValue">
              1 / 5
            </strong>
          </div>

          <div class="high-steaks-scoreboard-side high-steaks-scoreboard-side-player">
            <ol
              id="highSteaksPlayerWins"
              class="high-steaks-score-pips"
            >
              <li></li>
              <li></li>
              <li></li>
            </ol>

            <span class="high-steaks-scoreboard-label">
              YOU
            </span>
          </div>
        </div>

        <div class="high-steaks-opponent-nameplate">
          <span>YOUR OPPONENT</span>

          <h2 id="highSteaksOpponentName">
            THE DRIFTER
          </h2>
        </div>

        <div
          id="highSteaksOpponentHand"
          class="high-steaks-opponent-hand"
          aria-label="Opponent hand"
        ></div>

        <div class="high-steaks-table-status">
          <span
            id="highSteaksRuleCard"
            class="high-steaks-rule-card"
          >
            STANDARD DUEL
          </span>

          <strong
            id="highSteaksPhaseText"
            class="high-steaks-phase-text"
            aria-live="polite"
          >
            CHOOSE EXACTLY TWO CARDS
          </strong>
        </div>

        <div
          id="highSteaksOpponentPlayZone"
          class="high-steaks-play-card-row high-steaks-play-card-row-opponent"
          aria-label="Opponent played cards"
        ></div>

        <div
          id="highSteaksPlayerPlayZone"
          class="high-steaks-play-card-row high-steaks-play-card-row-player"
          aria-label="Your played cards"
        ></div>

        <div
          id="highSteaksRoundHistory"
          class="high-steaks-round-history"
          aria-label="Round history"
        ></div>

        <div
          id="highSteaksPlayerHand"
          class="high-steaks-player-hand"
          role="list"
          aria-label="Your hand"
        ></div>

        <div class="high-steaks-player-controls">
          <button
            id="highSteaksClearButton"
            class="high-steaks-control-button high-steaks-control-button-secondary"
            type="button"
          >
            CLEAR SELECTION
          </button>

          <button
            id="highSteaksConfirmButton"
            class="high-steaks-control-button high-steaks-control-button-primary"
            type="button"
            disabled
          >
            PLAY SELECTED CARDS
          </button>
        </div>
      </div>
    </div>
  </section>
</div>

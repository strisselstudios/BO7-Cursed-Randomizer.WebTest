<!-- ==========================================================
     1. HIGH STEAKS WINDOW
     ----------------------------------------------------------
     Tier III Sunken Mining Town seated-perspective card table.
========================================================== -->
<div
  id="highSteaksOverlay"
  class="high-steaks-overlay"
  aria-hidden="true"
  hidden
>
  <section
    id="highSteaksWindow"
    class="high-steaks-window"
    role="dialog"
    aria-modal="true"
    aria-labelledby="highSteaksTitle"
    tabindex="-1"
  >
    <header class="high-steaks-title-bar">
      <div class="high-steaks-window-identity">
        <span
          class="high-steaks-window-mark"
          aria-hidden="true"
        >
          HS
        </span>

        <div>
          <span>
            SUNKEN MINING TOWN SALOON
          </span>

          <strong id="highSteaksTitle">
            HIGH STEAKS
          </strong>
        </div>
      </div>

      <button
        id="highSteaksCloseButton"
        class="high-steaks-close-button"
        type="button"
        aria-label="Leave the High Steaks table"
      >
        ×
      </button>
    </header>

           <div
      id="highSteaksScene"
      class="high-steaks-scene"
      data-high-steaks-scene-state="lobby"
      data-high-steaks-screen="lobby"
      data-high-steaks-phase="idle"
    >

      <!-- ====================================================
           1.1 HIGH STEAKS LOBBY
      ===================================================== -->

      <section
        id="highSteaksLobbyScreen"
        class="high-steaks-menu-screen high-steaks-lobby-screen"
        aria-labelledby="highSteaksLobbyHeading"
      >

        <div class="high-steaks-menu-panel">

          <span class="high-steaks-menu-eyebrow">
            SUNKEN MINING TOWN SALOON
          </span>

          <h2 id="highSteaksLobbyHeading">
            HIGH STEAKS
          </h2>

          <button
            id="highSteaksPlayButton"
            class="high-steaks-menu-primary-button"
            type="button"
          >
            Play 'High-Steaks'
          </button>

        </div>

      </section>

      <!-- ====================================================
           1.2 DEALER AND DIFFICULTY SELECTION
      ===================================================== -->

      <section
        id="highSteaksDealerSelectScreen"
        class="high-steaks-menu-screen high-steaks-dealer-select-screen"
        aria-labelledby="highSteaksDealerSelectHeading"
        hidden
      >

        <div class="high-steaks-dealer-select-panel">

          <header class="high-steaks-dealer-select-header">

            <span class="high-steaks-menu-eyebrow">
              CHOOSE YOUR TABLE
            </span>

            <h2 id="highSteaksDealerSelectHeading">
              SELECT DEALER / DIFFICULTY
            </h2>

          </header>

          <button
            id="highSteaksTeddStandardButton"
            class="high-steaks-dealer-card"
            type="button"
            data-high-steaks-dealer-id="tedd"
            data-high-steaks-difficulty-id="standard"
          >

            <img
              src="meat/features/high-steaks/images/opponents/dealer-1.png"
              alt=""
              aria-hidden="true"
              draggable="false"
            >

            <span class="high-steaks-dealer-card-details">

              <strong>
                T.E.D.D.
              </strong>

              <span class="high-steaks-dealer-difficulty">
                STANDARD
              </span>

              <span class="high-steaks-dealer-description">
                A balanced opponent who manages his remaining
                cards without seeing your selected pair.
              </span>

            </span>

          </button>

                    <button
            id="highSteaksDealerBackButton"
            class="high-steaks-menu-secondary-button"
            type="button"
          >
            BACK
          </button>

        </div>

      </section>

      <!-- ====================================================
           1.3 HIGH STEAKS TABLE
      ===================================================== -->

      <div
        id="highSteaksPerspectiveStage"
        class="high-steaks-perspective-stage"
        aria-hidden="true"
      >

        <!-- ==================================================
             1.3 STATIC SCENE ART
        =================================================== -->

        <img
          class="high-steaks-scene-art high-steaks-scene-background-art"
          src="meat/features/high-steaks/images/backgrounds/background-1.png"
          alt=""
          aria-hidden="true"
          draggable="false"
        >

        <img
          class="high-steaks-scene-art high-steaks-scene-dealer-art"
          src="meat/features/high-steaks/images/opponents/dealer-1.png"
          alt=""
          aria-hidden="true"
          draggable="false"
        >

        <img
          class="high-steaks-scene-art high-steaks-scene-table-art"
          src="meat/features/high-steaks/images/tables/table-1.png"
          alt=""
          aria-hidden="true"
          draggable="false"
        >

        <!-- ==================================================
             1.4 MATCH SCORE
        =================================================== -->
        <div
          class="high-steaks-scoreboard"
          aria-label="Match score"
        >
          <div class="high-steaks-scoreboard-side">
            <span class="high-steaks-scoreboard-label">
              DEALER
            </span>

            <ol
              id="highSteaksOpponentWins"
              class="high-steaks-score-pips"
            >
              <li></li>
              <li></li>
              <li></li>
            </ol>
          </div>

          <div class="high-steaks-scoreboard-round">
            <span>
              ROUND
            </span>

            <strong id="highSteaksRoundValue">
              1 / 5
            </strong>
          </div>

          <div class="high-steaks-scoreboard-side high-steaks-scoreboard-side-player">
            <ol
              id="highSteaksPlayerWins"
              class="high-steaks-score-pips"
            >
              <li></li>
              <li></li>
              <li></li>
            </ol>

            <span class="high-steaks-scoreboard-label">
              YOU
            </span>
          </div>
        </div>

        <!-- ==================================================
             1.5 OPPONENT AREA
        =================================================== -->
        <div class="high-steaks-opponent-zone">
          <div class="high-steaks-opponent-nameplate">
            <span>
              YOUR OPPONENT
            </span>

            <h2 id="highSteaksOpponentName">
              T.E.D.D.
            </h2>
          </div>

          <div
            id="highSteaksOpponentHand"
            class="high-steaks-opponent-hand"
            aria-label="Opponent hand"
          ></div>
        </div>

        <!-- ==================================================
             1.6 FOUR PLAYED-CARD POSITIONS
        =================================================== -->
        <div class="high-steaks-table-play-area">
          <div class="high-steaks-play-zone high-steaks-play-zone-opponent">
            <div
              id="highSteaksOpponentPlayZone"
              class="high-steaks-play-card-row"
              aria-label="Opponent played cards"
            ></div>
          </div>

          <div class="high-steaks-play-zone high-steaks-play-zone-player">
            <div
              id="highSteaksPlayerPlayZone"
              class="high-steaks-play-card-row"
              aria-label="Your played cards"
            ></div>
          </div>
        </div>
           
          <!-- ==================================================
             CARD MOTION LAYER
             --------------------------------------------------
             Moving cards render above the table but behind the
             foreground player hand.
        =================================================== -->

        <div
          id="highSteaksCardMotionLayer"
          class="high-steaks-card-motion-layer"
          aria-hidden="true"
        ></div>

        <!-- ==================================================
             1.7 TABLE STATUS
        =================================================== -->
        <div class="high-steaks-table-status">
          <span
            id="highSteaksRuleCard"
            class="high-steaks-rule-card"
          >
            STANDARD DUEL
          </span>

          <strong
            id="highSteaksPhaseText"
            class="high-steaks-phase-text"
            aria-live="polite"
          >
            CHOOSE EXACTLY TWO CARDS
          </strong>

          <div
            id="highSteaksRoundHistory"
            class="high-steaks-round-history"
            aria-label="Round history"
          ></div>
        </div>

        <!-- ==================================================
             1.8 PLAYER HAND
        =================================================== -->
        <div class="high-steaks-player-zone">
          <div
            id="highSteaksPlayerHand"
            class="high-steaks-player-hand"
            role="list"
            aria-label="Your hand"
          ></div>
        </div>

        <!-- ==================================================
             1.9 CONTROLS
        =================================================== -->
        <div class="high-steaks-player-controls">
          <button
            id="highSteaksClearButton"
            class="high-steaks-control-button high-steaks-control-button-secondary"
            type="button"
          >
            CLEAR
          </button>

          <button
            id="highSteaksConfirmButton"
            class="high-steaks-control-button high-steaks-control-button-primary"
            type="button"
            disabled
          >
            PLACE CARDS
          </button>
        </div>

                   <!-- ==================================================
             1.8 MATCH RESULT
        =================================================== -->

        <section
          id="highSteaksResultsPanel"
          class="high-steaks-match-results"
          aria-labelledby="highSteaksResultHeading"
          hidden
        >

          <div class="high-steaks-match-results-panel">

            <span
              id="highSteaksResultEyebrow"
              class="high-steaks-menu-eyebrow"
            >
              TABLE SETTLED
            </span>

            <h2 id="highSteaksResultHeading">
              MATCH COMPLETE
            </h2>

            <p id="highSteaksResultSummary">
              Final score unavailable.
            </p>

            <div class="high-steaks-match-results-controls">

              <button
                id="highSteaksRematchButton"
                class="high-steaks-menu-primary-button"
                type="button"
              >
                PLAY AGAIN
              </button>

              <button
                id="highSteaksResultsMenuButton"
                class="high-steaks-menu-secondary-button"
                type="button"
              >
                RETURN TO SALOON
              </button>

            </div>

          </div>

        </section>
      </div>
    </div>
  </section>
</div>

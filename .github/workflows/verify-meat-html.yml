name: Verify MEAT HTML Build

on:
  push:
    branches:
      - main
      - reorganization/stable-layout
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-meat-html:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify generated MEAT HTML
        run: >
          node tools/reorganization/meat-html-build.js
          --check-against meat.html

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>MEAT.exe Section Heading Cleanup</title>
  <style>
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    button {
      display: block;
      margin-top: 16px;
      padding: 10px 14px;
    }

    pre {
      min-height: 90px;
      padding: 12px;
      overflow: auto;
      background: #111;
      color: #eee;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>MEAT.exe Section Heading Cleanup</h1>

  <p>
    Select the current <code>meat.html</code>. This tool removes only
    section-number prefixes deeper than one child level from HTML comments.
    It does not alter markup, attributes, text, scripts, or whitespace outside
    comments.
  </p>

  <input
    id="fileInput"
    type="file"
    accept=".html,text/html"
  >

  <button id="processButton" type="button">
    PROCESS AND DOWNLOAD
  </button>

  <pre id="status">No file processed.</pre>

  <script>
    const fileInput = document.getElementById("fileInput");
    const processButton = document.getElementById("processButton");
    const status = document.getElementById("status");

    function cleanSectionHeadingNumbers(source) {
      return source.replace(/<!--[\s\S]*?-->/g, (comment) => {
        return comment.replace(
          /^(\s*)(\d+(?:\.\d+){2,})\s+(.+)$/gm,
          "$1$3"
        );
      });
    }

    function removeComments(source) {
      return source.replace(/<!--[\s\S]*?-->/g, "");
    }

    function countDeepHeadings(source) {
      let count = 0;

      source.replace(/<!--[\s\S]*?-->/g, (comment) => {
        const matches = comment.match(
          /^(\s*)(\d+(?:\.\d+){2,})\s+(.+)$/gm
        );

        count += matches ? matches.length : 0;
        return comment;
      });

      return count;
    }

    processButton.addEventListener("click", async () => {
      const file = fileInput.files?.[0];

      if (!file) {
        status.textContent = "Select meat.html first.";
        return;
      }

      const original = await file.text();
      const cleaned = cleanSectionHeadingNumbers(original);

      if (removeComments(original) !== removeComments(cleaned)) {
        status.textContent =
          "STOPPED: content outside HTML comments changed.";
        return;
      }

      const remainingDeepHeadings = countDeepHeadings(cleaned);

      if (remainingDeepHeadings !== 0) {
        status.textContent =
          `STOPPED: ${remainingDeepHeadings} deep headings remain.`;
        return;
      }

      const blob = new Blob([cleaned], {
        type: "text/html;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "meat.html";
      link.click();

      URL.revokeObjectURL(url);

      status.textContent =
        original === cleaned
          ? "No deeply nested headings were found."
          : "Complete. Non-comment HTML remained byte-for-byte identical.";
    });
  </script>
</body>
</html>
